name: Build Windows exe

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Stamp build number into the app
        shell: pwsh
        run: |
          (Get-Content yt_downloader.py) -replace '^APP_BUILD = 0', "APP_BUILD = ${{ github.run_number }}" | Set-Content -Encoding utf8 yt_downloader.py
          if (-not (Select-String -Path yt_downloader.py -Pattern "^APP_BUILD = ${{ github.run_number }}")) { throw "build number not stamped" }

      - name: Build exe
        run: python -m PyInstaller --onefile --windowed --name "YT Downloader" yt_downloader.py

      - name: Upload exe (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: YT-Downloader-exe
          path: dist/YT Downloader.exe

      - name: Publish as "latest" download on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: YT Downloader (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Download **YT Downloader.exe** below and double-click it.
            Build ${{ github.run_number }}, made automatically from commit ${{ github.sha }}.
            The app updates itself; you only need to download this once.
          files: dist/YT Downloader.exe
